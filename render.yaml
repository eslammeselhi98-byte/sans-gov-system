services:
  - type: web
    name: sans-gov-backend
    runtime: node
    repo: https://github.com/اسم-مستخدمك/sans-gov-system # غيّر هذا لاحقاً
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # سيطالبك بإدخاله يدوياً عند النشر
      - key: PORT
        value: 10000