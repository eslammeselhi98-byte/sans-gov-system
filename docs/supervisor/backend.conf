[program:sans_backend]
command=/usr/bin/env python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/var/www/sans-pms/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/sans_backend.err.log
stdout_logfile=/var/log/sans_backend.out.log
environment=ENVIRONMENT="production",SECRET_KEY="%(ENV_SECRET_KEY)s"
